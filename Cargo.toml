[package]
name = "coil"
version = "0.1.0"
edition = "2021"
description = "A minimal terminal frontend for yt-dlp"
license = "MIT"

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
